<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Улучшение фото и видео — тестовое приложение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <h1>Улучшение качества фото и видео</h1>
  <p class="subtitle">Тестовая версия. Загружай файл, выбирай тип, жди результат.</p>

  <div class="tabs views">
    <button class="tab active" data-view="upload">Обработка</button>
    <button class="tab" data-view="history">История</button>
  </div>

  <div id="uploadView">
    <div class="tabs">
      <button class="tab active" data-type="photo">Фото</button>
      <button class="tab" data-type="video">Видео</button>
    </div>

    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*,.jpg,.jpeg,.png,.webp">
      <p id="dropText">Выбери файл фото (JPG/PNG)</p>
    </div>

    <p class="hint" id="sizeHint">Фото и видео — до 500 МБ, загружаются напрямую в хранилище.</p>

    <div class="ratio-row">
      <span class="ratio-label">Соотношение сторон:</span>
      <div class="ratio-tabs">
        <button class="ratio-btn active" data-ratio="">Как есть</button>
        <button class="ratio-btn" data-ratio="16:9">16:9</button>
        <button class="ratio-btn" data-ratio="9:16">9:16</button>
        <button class="ratio-btn" data-ratio="1:1">1:1</button>
      </div>
    </div>

    <div class="ratio-row" id="modeRow" style="display:none">
      <span class="ratio-label">Как подогнать под формат:</span>
      <div class="ratio-tabs">
        <button class="ratio-btn active" data-mode="crop">Обрезать</button>
        <button class="ratio-btn" data-mode="pad">Добавить поля (размытый фон)</button>
      </div>
    </div>

    <button class="btn" id="submitBtn" disabled>Улучшить</button>

    <div class="status" id="status"></div>

    <div class="result" id="result"></div>
  </div>

  <div id="historyView" style="display:none">
    <p class="hint" id="historyHint">Здесь сохраняются готовые результаты (до 30 последних, за 30 дней).</p>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script src="vercel-blob-client.js"></script>
<script src="app.js"></script>
</body>
</html>
